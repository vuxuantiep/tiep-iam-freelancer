<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiep Vu Xuan – KI-Automatisierung & Enterprise Lösungen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #fafbfc;
    --bg2: #f3f5f7;
    --text-dark: #1a2332;
    --text-muted: #556b7d;
    --border: #d8dfe6;
    --accent: #1e5a96;
    --accent2: #2d7fb8;
    --success: #2d8a6f;
    --card-bg: #ffffff;
    --display: 'Playfair Display', serif;
    --body: 'Inter', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text-dark);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.8;
    overflow-x: hidden;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

  /* ─── NAV ─── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 5vw; height: 72px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--display); font-weight: 700; font-size: 1.25rem;
    color: var(--text-dark); text-decoration: none; letter-spacing: -0.5px;
  }
  .nav-logo span { color: var(--accent); }

  .nav-links { display: flex; gap: 2.8rem; list-style: none; }
  .nav-links a {
    font-family: var(--body); font-weight: 500; font-size: 0.9rem;
    color: var(--text-muted); text-decoration: none;
    transition: color 0.3s ease;
  }
  .nav-links a:hover { color: var(--accent); }

  .nav-cta {
    font-family: var(--body); font-size: 0.85rem; font-weight: 600;
    background: var(--accent); color: white;
    padding: 10px 24px; border: none; border-radius: 6px;
    cursor: pointer; text-decoration: none; transition: all 0.3s ease;
    letter-spacing: 0.3px;
  }
  .nav-cta:hover { background: var(--accent2); transform: translateY(-1px); }

  /* ─── LAYOUT ─── */
  section { padding: 100px 5vw; }
  .container { max-width: 1080px; margin: 0 auto; }

  .tag {
    font-family: var(--body); font-size: 0.75rem; font-weight: 600;
    color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 16px; display: block;
  }

  h2.section-title {
    font-family: var(--display); font-weight: 700; font-size: clamp(2.2rem, 5vw, 3.5rem);
    line-height: 1.2; margin-bottom: 20px; color: var(--text-dark);
  }
  h2.section-title em { font-style: normal; color: var(--accent); }

  .section-lead {
    font-size: 1.05rem; color: var(--text-muted);
    max-width: 600px; margin-bottom: 60px; line-height: 1.8;
  }

  /* ─── HERO ─── */
  #home {
    min-height: 100vh; display: flex; align-items: center;
    padding-top: 140px; position: relative;
  }

  .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }

  .hero-eyebrow {
    font-family: var(--body); font-size: 0.8rem; color: var(--accent);
    letter-spacing: 0.5px; margin-bottom: 24px;
  }

  .hero-name {
    font-family: var(--display); font-weight: 700; font-size: clamp(2.4rem, 6vw, 4.5rem);
    line-height: 1.1; margin-bottom: 12px; color: var(--text-dark); letter-spacing: -1px;
  }

  .hero-role {
    font-family: var(--body); font-weight: 500; font-size: 1.2rem;
    color: var(--text-muted); margin-bottom: 32px;
  }

  .hero-desc {
    font-size: 1.05rem; color: var(--text-muted); line-height: 1.85;
    max-width: 520px; margin-bottom: 40px;
  }

  .hero-btns { display: flex; gap: 16px; flex-wrap: wrap; }
  .btn-primary {
    font-family: var(--body); font-size: 0.9rem; font-weight: 600;
    background: var(--accent); color: white;
    padding: 14px 32px; border: none; border-radius: 6px;
    cursor: pointer; text-decoration: none; transition: all 0.3s ease;
    letter-spacing: 0.3px;
  }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(30,90,150,0.2); }

  .btn-outline {
    font-family: var(--body); font-size: 0.9rem; font-weight: 600;
    background: transparent; color: var(--accent);
    padding: 14px 32px; border: 2px solid var(--accent);
    border-radius: 6px; cursor: pointer; text-decoration: none; transition: all 0.3s ease;
  }
  .btn-outline:hover { background: var(--accent); color: white; }

  .hero-stats {
    display: flex; gap: 48px; margin-top: 56px; padding-top: 40px;
    border-top: 1px solid var(--border);
  }
  .stat-num {
    font-family: var(--display); font-weight: 700; font-size: 2rem;
    color: var(--accent); display: block;
  }
  .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; }

  .hero-right { display: flex; justify-content: center; }
  .hero-photo-wrap {
    width: 340px; height: 420px; border-radius: 8px;
    overflow: hidden; box-shadow: 0 20px 60px rgba(26,35,50,0.08);
  }
  .hero-photo-wrap img {
    width: 100%; height: 100%; object-fit: cover;
  }

  /* ─── SERVICES ─── */
  #services { background: var(--bg2); }

  .services-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; }
  .service-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 40px 32px;
    transition: all 0.3s ease;
  }
  .service-card:hover {
    border-color: var(--accent);
    box-shadow: 0 12px 40px rgba(30,90,150,0.08);
  }

  .service-icon { font-size: 2rem; margin-bottom: 16px; display: block; }
  .service-card h3 {
    font-family: var(--display); font-weight: 600; font-size: 1.3rem;
    margin-bottom: 12px; color: var(--text-dark);
  }
  .service-card p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 16px; }
  .service-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .service-tag {
    font-size: 0.75rem; color: var(--accent); background: rgba(30,90,150,0.06);
    padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(30,90,150,0.15);
  }

  /* ─── KI SOLUTIONS ─── */
  #ki-loesungen { background: var(--bg); }

  .ki-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: start; margin-bottom: 80px; }
  .ki-features { display: flex; flex-direction: column; gap: 20px; }
  .ki-feature {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 24px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 8px;
  }
  .ki-feature-icon {
    font-size: 1.4rem; flex-shrink: 0; margin-top: 2px;
  }
  .ki-feature h4 {
    font-family: var(--display); font-weight: 600; font-size: 1.05rem;
    margin-bottom: 6px; color: var(--text-dark);
  }
  .ki-feature p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.7; }

  /* BERATUNGSMODELL */
  .consulting-box {
    background: linear-gradient(135deg, #f3f5f7, #eef1f5);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 40px; margin-top: 60px;
  }
  .consulting-box h3 {
    font-family: var(--display); font-weight: 600; font-size: 1.4rem;
    margin-bottom: 16px; color: var(--text-dark);
  }
  .consulting-box p {
    font-size: 0.95rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.8;
  }
  .benefits { list-style: none; margin-top: 20px; }
  .benefits li {
    display: flex; align-items: center; gap: 12px;
    font-size: 0.9rem; color: var(--text-dark); margin-bottom: 8px;
  }
  .benefits li::before { content: '✓'; color: var(--success); font-weight: 700; flex-shrink: 0; }

  /* ─── PORTFOLIO ─── */
  #portfolio { background: var(--bg2); }

  .portfolio-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; }
  .port-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
    transition: all 0.3s ease;
  }
  .port-card:hover {
    border-color: var(--accent);
    box-shadow: 0 12px 40px rgba(30,90,150,0.08);
  }

  .port-header {
    padding: 28px 28px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .port-badge {
    font-size: 0.7rem; text-transform: uppercase;
    padding: 5px 12px; border-radius: 4px; white-space: nowrap;
    letter-spacing: 0.5px; font-weight: 600;
  }
  .badge-green { background: rgba(45,138,111,0.1); color: var(--success); border: 1px solid rgba(45,138,111,0.2); }
  .badge-blue  { background: rgba(30,90,150,0.1); color: var(--accent); border: 1px solid rgba(30,90,150,0.2); }

  .port-body { padding: 28px; }
  .port-body h3 {
    font-family: var(--display); font-weight: 600; font-size: 1.2rem;
    margin-bottom: 10px; color: var(--text-dark);
  }
  .port-body p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }
  .port-specs { display: flex; flex-direction: column; gap: 10px; }
  .port-spec { font-size: 0.85rem; color: var(--text-dark); }
  .port-spec::before { content: '—'; color: var(--accent); margin-right: 8px; font-weight: 600; }
  .port-stack { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .stack-tag {
    font-size: 0.75rem; color: var(--accent); background: rgba(30,90,150,0.06);
    padding: 4px 10px; border-radius: 4px;
  }

  /* ─── EXPERIENCE ─── */
  #experience { background: var(--bg); }

  .exp-timeline { display: flex; flex-direction: column; gap: 24px; }
  .exp-item {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 28px;
    border-left: 4px solid var(--accent);
  }
  .exp-period {
    font-size: 0.8rem;
