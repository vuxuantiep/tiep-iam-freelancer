<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiep Coach Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <style>
        body { background-color: #131314; color: #e3e3e3; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        .gemini-gradient {
            background: linear-gradient(92deg, #4285f4 0%, #1a73e8 25%, #34a853 50%, #4285f4 100%);
            background-size: 200% auto;
            animation: flow 4s linear infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .gemini-bg-gradient {
            background: linear-gradient(92deg, #4285f4 0%, #1a73e8 50%, #34a853 100%);
            background-size: 200% auto;
            animation: flow 4s linear infinite;
        }

        @keyframes flow { to { background-position: 200% center; } }

        /* Sidebar Anpassung für flüssige Bedienung */
        .sidebar { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); width: 0; overflow: hidden; background-color: #1e1f20; z-index: 50; }
        .sidebar.open { width: 280px; }
        
        .chat-container { max-width: 800px; margin: 0 auto; width: 100%; }
        
        .input-area { 
            background-color: #1e1f20; 
            border-radius: 32px; 
            padding: 10px 20px; 
            border: 1px solid #3c4043; 
            transition: border-color 0.2s, box-shadow 0.2s; 
        }
        .input-area:focus-within { border-color: #4285f4; box-shadow: 0 0 0 1px #4285f4; }

        .msg-bubble { line-height: 1.6; border-radius: 20px; word-wrap: break-word; }
        
        .logo-glow {
            color: #4285f4;
            filter: drop-shadow(0 0 8px rgba(66, 133, 244, 0.4));
        }

        #chat-scroll::-webkit-scrollbar { width: 8px; }
        #chat-scroll::-webkit-scrollbar-track { background: transparent; }
        #chat-scroll::-webkit-scrollbar-thumb { background: #3c4043; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden relative">

    <div id="sidebar" class="sidebar flex flex-col h-full border-r border-gray-800 absolute lg:relative">
        <div class="p-6 border-b border-gray-800">
            <span class="gemini-gradient text-2xl">Tiep Tools</span>
        </div>
        <div class="p-6 space-y-6 flex-1">
            <div class="bg-[#2b2b2b] p-5 rounded-2xl border border-gray-700">
                <label class="block mb-3 text-[10px] font-bold text-blue-400 uppercase tracking-widest">Lebenslauf hochladen</label>
                <input type="file" id="resume-upload" accept=".docx,.txt" class="block w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-600 file:text-white cursor:pointer hover:file:bg-blue-500 transition-all">
                <button id="analyze-btn" class="w-full mt-4 gemini-bg-gradient text-white text-sm py-3 rounded-xl font-bold transition-all hidden shadow-lg uppercase tracking-tight">Analyse starten</button>
            </div>
            <button id="ikigai-btn" class="w-full text-left p-4 bg-gray-800/40 hover:bg-gray-800 rounded-xl text-sm border border-gray-700 flex items-center gap-4 transition-all">
                <i class="fas fa-dharmachakra text-blue-400 text-lg"></i>
                <span class="font-medium text-gray-300">Ikigai Analyse</span>
            </button>
        </div>
        <div class="p-6 text-[10px] text-gray-600 border-t border-gray-800 italic uppercase">Tiep Intelligence v2.5</div>
    </div>

    <div class="flex-1 flex flex-col bg-[#131314] h-full relative">
        <header class="p-4 flex items-center justify-between border-b border-gray-800/50 bg-[#131314] z-10">
            <button id="menu-btn" class="text-xl p-2 hover:bg-gray-800 rounded-full transition-colors"><i class="fas fa-bars"></i></button>
            <h1 class="text-2xl gemini-gradient">Tiep Coach</h1>
            
            <div class="flex items-center gap-4">
                <button id="toggle-audio-btn" class="flex items-center gap-3 px-4 py-2 rounded-full bg-gray-800/60 border border-gray-700 hover:border-blue-500 transition-all group">
                    <span id="audio-label" class="text-[10px] uppercase font-bold text-gray-400 tracking-wider">Audio: An</span>
                    <div id="audio-visualizer" class="flex gap-1 items-center h-3">
                        <div class="w-0.5 h-full bg-blue-500 rounded-full"></div>
                        <div class="w-0.5 h-2 bg-blue-400 rounded-full"></div>
                        <div class="w-0.5 h-3 bg-blue-500 rounded-full"></div>
                    </div>
                </button>
                <i class="fas fa-briefcase logo-glow text-xl"></i>
            </div>
        </header>

        <div id="chat-scroll" class="flex-1 overflow-y-auto p-4 md:p-6 pb-28">
            <div id="chat-history" class="chat-container space-y-6 py-4">
                <div class="flex gap-4">
                    <div class="w-10 h-10 rounded-full gemini-bg-gradient flex-shrink-0 flex items-center justify-center shadow-lg"><i class="fas fa-robot text-white text-sm"></i></div>
                    <div class="p-5 bg-[#1e1f20] border border-gray-800 text-gray-200 msg-bubble max-w-[85%] shadow-sm text-sm md:text-base">
                        Hallo! Ich bin dein **Tiep Coach**. Ich bin bereit, deinen Lebenslauf auf Top-Niveau zu optimieren oder dein Ikigai zu entschlüsseln. Lad ein Dokument hoch, um loszulegen!
                    </div>
                </div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 p-4 bg-[#131314] border-t border-gray-800/60 z-20">
            <div class="chat-container">
                <div class="input-area flex items-center gap-3 shadow-xl">
                    <input type="text" id="user-input" class="flex-1 bg-transparent outline-none text-white text-base py-1 placeholder-gray-500" placeholder="Schreibe eine Nachricht..." autocomplete="off">
                    <button id="send-btn" class="text-blue-500 text-xl hover:scale-110 active:scale-95 transition-all p-2">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://ai.vuxuantiep-b2f.workers.dev";
        let extractedText = "";
        let audioActive = true;

        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        const fileInput = document.getElementById('resume-upload');
        const analyzeBtn = document.getElementById('analyze-btn');
        const ikigaiBtn = document.getElementById('ikigai-btn');
        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const scroll = document.getElementById('chat-scroll');
        const audioBtn = document.getElementById('toggle-audio-btn');
        const audioLabel = document.getElementById('audio-label');
        const audioVisualizer = document.getElementById('audio-visualizer');

        menuBtn.addEventListener('click', () => sidebar.classList.toggle('open'));

        audioBtn.addEventListener('click', () => {
            audioActive = !audioActive;
            audioLabel.innerText = audioActive ? "Audio: An" : "Audio: Aus";
            audioLabel.style.color = audioActive ? "#9ca3af" : "#ef4444";
            audioVisualizer.style.opacity = audioActive ? "1" : "0.2";
            if(!audioActive) window.speechSynthesis.cancel();
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async (event) => {
                    if (file.name.endsWith('.docx')) {
                        const result = await mammoth.extractRawText({arrayBuffer: event.target.result});
                        extractedText = result.value;
                    } else {
                        extractedText = event.target.result;
                    }
                    analyzeBtn.classList.remove('hidden');
                    addMessage('ai', "Dokument erfolgreich geladen! Klicke jetzt im Menü auf **'Analyse starten'**.");
                };
                if (file.name.endsWith('.docx')) reader.readAsArrayBuffer(file);
                else reader.readAsText(file);
            }
        });

        function showThinkingIndicator() {
            const div = document.createElement('div');
            div.id = "thinking-indicator";
            div.className = "flex gap-4 animate-pulse";
            div.innerHTML = `
                <div class="w-10 h-10 rounded-full gemini-bg-gradient flex-shrink-0 flex items-center justify-center shadow-lg"><i class="fas fa-robot text-white text-sm"></i></div>
                <div class="p-5 bg-[#1e1f20] border border-gray-800 text-gray-400 msg-bubble max-w-[85%] flex items-center gap-3 shadow-sm text-sm">
                    <i class="fas fa-circle-notch animate-spin text-blue-500"></i>
                    <span>Tiep Coach analysiert...</span>
                </div>
            `;
            chatHistory.appendChild(div);
            scroll.scrollTop = scroll.scrollHeight;
        }

        function removeThinkingIndicator() {
            const indicator = document.getElementById('thinking-indicator');
            if (indicator) indicator.remove();
        }

        function speak(text) {
            if (!audioActive) return;
            window.speechSynthesis.cancel();
            let cleanText = text.replace(/[\*\#\_]/g, " ").replace(/[-•]\s+/g, ". ").replace(/\s+/g, " ").trim();
            const utterance = new SpeechSynthesisUtterance(cleanText);
            const voices = window.speechSynthesis.getVoices();
            const bestVoice = voices.find(v => v.lang.startsWith('de') && (v.name.includes('Google') || v.name.includes('Natural'))) || voices.find(v => v.lang.startsWith('de'));
            utterance.voice = bestVoice;
            utterance.rate = 0.97;
            window.speechSynthesis.speak(utterance);
        }

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = "flex gap-4 " + (role === 'user' ? "justify-end" : "");
            const avatar = role === 'user' 
                ? '<div class="w-10 h-10 rounded-full bg-gray-700 border border-gray-600 flex-shrink-0 flex items-center justify-center text-[10px] font-bold">DU</div>'
                : '<div class="w-10 h-10 rounded-full gemini-bg-gradient flex-shrink-0 flex items-center justify-center shadow-lg"><i class="fas fa-robot text-white text-sm"></i></div>';
            const content = `<div class="p-5 msg-bubble ${role === 'user' ? 'bg-[#2b2b2b] text-gray-100 shadow-inner' : 'bg-[#1e1f20] border border-gray-800 text-gray-200'} max-w-[85%] shadow-sm text-sm md:text-base">${text}</div>`;
            div.innerHTML = role === 'user' ? content + avatar : avatar + content;
            chatHistory.appendChild(div);
            setTimeout(() => { scroll.scrollTop = scroll.scrollHeight; }, 50);
        }

        async function askAI(msg, systemMsg) {
            showThinkingIndicator();
            const finalPrompt = extractedText ? `Hier ist der Lebenslauf des Nutzers:\n${extractedText}\n\nAnfrage/Frage: ${msg}` : msg;
            try {
                const res = await fetch(`${WORKER_URL}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        "model": "openrouter/free",
                        "messages": [{"role": "system", "content": systemMsg}, {"role": "user", "content": finalPrompt}]
                    })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                removeThinkingIndicator();
                addMessage('ai', reply);
                speak(reply);
            } catch (e) { 
                removeThinkingIndicator();
                addMessage('ai', "Problem bei der Verarbeitung. Bitte erneut versuchen."); 
            }
        }

        function handleSend() {
            const message = userInput.value.trim();
            if (message) {
                addMessage('user', message);
                userInput.value = "";
                askAI(message, "Du bist Tiep Coach, ein erfahrener Karriereberater. Antworte präzise auf Deutsch.");
            }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSend();
            }
        });

        analyzeBtn.addEventListener('click', () => {
            sidebar.classList.remove('open');
            addMessage('user', "Bitte führe eine umfassende Lebenslauf-Optimierung durch.");
            askAI("Führe die Premium-Lebenslauf-Analyse durch.", "Du bist HR-Coach. Analysiere den CV strukturiert nach Stärken und ATS-Lesbarkeit.");
        });

        ikigaiBtn.addEventListener('click', () => {
            sidebar.classList.remove('open');
            addMessage('user', "Ich möchte meine Ikigai-Berufung finden.");
            askAI("Starte die Ikigai-Analyse.", "Du bist Ikigai-Master. Stelle kurze, prägnante Einzelfragen.");
        });

        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    </script>
</body>
</html>
